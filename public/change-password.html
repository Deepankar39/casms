<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update password • CASMS</title><link rel="stylesheet" href="/css/styles.css"></head><body>
<div class="auth"><section class="auth-story"><div class="brand"><span class="brand-mark">C</span> CASMS</div><div><span class="story-pill">Account security</span><h2>Secure your new workspace.</h2><p>Choose a personal password before viewing campus information.</p></div><p class="auth-bottom">A safer way to manage your campus.</p></section><main class="auth-main"><div class="auth-form-wrap"><div class="eyebrow">FIRST-TIME SETUP</div><h1 class="form-heading">Set a new password</h1><p class="subtitle">Your new password must contain at least 12 characters.</p><form id="change-form"><p id="message" class="alert" role="alert"></p><div class="field"><label for="current">Temporary / current password</label><input id="current" type="password" autocomplete="current-password" required></div><div class="field"><label for="updated">New password</label><input id="updated" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div><button class="btn full" type="submit" id="save-btn">Save password →</button></form></div></main></div>
<script type="module" src="/js/change-password.js"></script></body></html>
